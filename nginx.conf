server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/nutrition/v1 {
        return 404;
    }

    location ^~ /api/nutrition/v1/ {
        # Resolve on request so the weight-only Compose stack still starts without Nutrition.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nutrition_upstream nutrition-service:8000;
        rewrite ^/api/nutrition/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://$nutrition_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_pass_header X-Request-ID;
    }

    location /api/ {
        client_max_body_size 8m;
        proxy_pass http://weight-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
